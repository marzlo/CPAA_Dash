name: Refresh CPAA Dashboard

on:
  schedule:
    # 每天 UTC 01:00 (台北時間 09:00) 自動抓一次 Jira 最新資料並重新部署
    - cron: '0 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Fetch latest data from Jira
        env:
          JIRA_SITE: mobiledrivetech.atlassian.net
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_JQL: 'filter=12399'
        run: python scripts/fetch_jira.py

      - name: Build dashboard_data.json
        run: python scripts/build_data.py

      - name: Record today's snapshot into history.json
        run: python scripts/update_history.py

      - name: Commit history snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || git commit -m "Update dashboard history snapshot ($(TZ=Asia/Taipei date +%F))"
          git push

      - name: Generate dashboard.html
        run: python scripts/gen_dashboard.py

      - name: Prepare Pages site
        run: |
          mkdir -p site
          cp dashboard.html site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4